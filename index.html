<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meu Objeto 3D em AR</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <!-- Alternativa com marcador Hiro (mais simples e estável) -->
  <!-- <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script> -->

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #aviso {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 9999;
      pointer-events: none;
      text-align: center;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>

  <div id="aviso">Aponte a câmera para o marcador</div>

  <!-- Cena AR com device orientation (giroscópio) -->
  <a-scene
    embedded
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    device-orientation-permission-ui="enabled: true">

    <!-- Iluminação -->
    <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.6"></a-light>

    <!-- Marcador Hiro padrão -->
    <a-marker preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01">

      <!-- 👇 SUBSTITUA pelo seu modelo .glb -->
      <a-entity
        position="0 0.5 0"
        scale="0.5 0.5 0.5"
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
        gltf-model="modelo.glb">
      </a-entity>

      <!-- Fallback: cubo caso o modelo não carregue -->
      <!--
      <a-box position="0 0.5 0" scale="0.5 0.5 0.5" color="#ff4b2b"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-box>
      -->

    </a-marker>

    <!-- Câmera com giroscópio -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    // Esconde o aviso após 5s
    setTimeout(() => {
      const aviso = document.getElementById('aviso');
      if (aviso) aviso.style.opacity = '0';
    }, 5000);

    // Pede permissão de giroscópio no iOS 13+
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      document.body.addEventListener('click', () => {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state !== 'granted') {
              alert('Permissão de orientação negada.');
            }
          })
          .catch(console.error);
      }, { once: true });
    }
  </script>
</body>
</html>
