<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Teste</title>
<style>body{margin:0;background:#222;}</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 2));
const luz = new THREE.DirectionalLight(0xffffff, 2);
luz.position.set(3, 5, 2);
scene.add(luz);

// 👇 MUDE AQUI
new GLTFLoader().load('./modelo.glb',
  (gltf) => {
    console.log('✅ Carregou!', gltf);
    scene.add(gltf.scene);
  },
  (xhr) => console.log('Carregando', (xhr.loaded/xhr.total*100).toFixed(0) + '%'),
  (err) => console.error('❌ Erro:', err)
);

(function anim() {
  requestAnimationFrame(anim);
  renderer.render(scene, camera);
})();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
