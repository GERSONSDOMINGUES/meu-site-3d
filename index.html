<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Experience - Realidade Aumentada</title>
  
  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    
    #ui {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }
    
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    
    #loading h1 { font-size: 2.5em; margin-bottom: 20px; }
    #loading p { font-size: 1.1em; opacity: 0.9; }
    
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #btn-start {
      margin-top: 30px;
      padding: 15px 40px;
      font-size: 1.1em;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }
    
    #btn-start:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <!-- Tela de Loading -->
  <div id="loading">
    <h1>🥽 AR Experience</h1>
    <div class="spinner"></div>
    <p>Apontando a câmera para o marcador Hiro...</p>
    <button id="btn-start" onclick="startAR()">Iniciar Realidade Aumentada</button>
  </div>

  <!-- Interface -->
  <div id="ui">📍 Aponte para o marcador Hiro para ver o modelo 3D</div>

  <!-- Cena AR -->
  <a-scene 
  embedded 
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  renderer="logarithmicDepthBuffer: true; alpha: true;"
  vr-mode-ui="enabled: false"
  gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;">

  <!-- 1. PRÉ-CARREGAMENTO DOS ASSETS -->
  <a-assets>
    <!-- Substitua "seu-modelo.glb" pelo caminho do seu arquivo -->
    <a-asset-item id="meuModelo" src="seu-modelo.glb"></a-asset-item>
  </a-assets>

  <!-- 2. MARCADOR HIRO -->
  <a-marker preset="hiro">
    
    <!-- 3. CARREGAMENTO DO MODELO GLTF/GLB -->
    <!-- Ajuste position, rotation e scale conforme necessário -->
    <a-entity 
      gltf-model="#meuModelo"
      position="0 0 0" 
      rotation="0 0 0"
      scale="1 1 1">
    </a-entity>
    
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

  <script>
    function startAR() {
      const loading = document.getElementById('loading');
      loading.style.opacity = '0';
      setTimeout(() => loading.style.display = 'none', 500);
    }
    
    // Auto-iniciar após 3 segundos (opcional)
    // setTimeout(startAR, 3000);
  </script>

</body>
</html>
